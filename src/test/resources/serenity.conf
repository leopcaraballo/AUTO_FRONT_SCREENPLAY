serenity {
    project.name = "AUTO_FRONT_SCREENPLAY"
    take.screenshots = FOR_EACH_ACTION
    browser.maximized = true
    console.colors = true
    logging = NORMAL
}

webdriver {
    driver = chrome
    autodownload = true
    capabilities {
        "goog:chromeOptions" {
            args = ["remote-allow-origins=*", "headless", "window-size=1920,1080", "disable-gpu", "no-sandbox"]
        }
    }
}

frontend {
    base.url = "http://localhost:3000"
    login.path = "/login"
    reception.path = "/reception"
    trajectory.path = "/trajectory"
}

testdata {
    patient {
        valid {
            name = "Juan Perez Auto"
        }
        invalid {
            name = "Ana Perez"
        }
    }
}
