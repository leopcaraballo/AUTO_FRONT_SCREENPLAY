serenity {
    project.name = "AUTO_FRONT_SCREENPLAY"
    outputDirectory = ${?serenity.outputDirectory}
    take.screenshots = FOR_EACH_ACTION
    browser.maximized = true
    console.colors = true
    logging = VERBOSE
}

webdriver {
    driver = chrome
    autodownload = true
    capabilities {
        "goog:chromeOptions" {
            args = ["remote-allow-origins=*", "headless", "window-size=1920,1080", "disable-gpu", "no-sandbox"]
        }
    }
}

environments {
    default {
        webdriver.base.url = "http://localhost:3000"
    }
}

registration = "http://localhost:3000/reception"
login = "http://localhost:3000/login"
